[project]
name = "pii-redactor"
version = "0.1.0"
description = "Offline PII redaction for PDF and Word documents using the Azure AI Language PII container"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24", "python-docx>=1.1", "requests>=2.31", "lxml>=5.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pii-redact = "pii_redactor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pii_redactor"]
